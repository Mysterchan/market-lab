name: Agent process lifecycle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 has setup-python builds for Ubuntu 24.04, not 26.04.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Report actual acceptance environment
        run: python -c "import platform, sys; print(sys.version); print(platform.platform()); print(platform.machine())"
      - name: Verify Agent IPC reply handoff and peer shutdown
        run: python -m unittest discover -s tests/platform -p test_agent_ipc_bridge.py -v
      - name: Verify Agent lifecycle without native market or App dependencies
        run: python -m unittest discover -s tests/platform -p test_agent_lifecycle.py -v
      - name: Verify installed SDK and selected-interpreter host
        run: python -m unittest discover -s tests/platform -p test_agent_interpreter.py -v
      - name: Install core dependencies for official preparation tests
        run: python -m pip install -r requirements.txt
      - name: Verify cross-process locks and workspace cleanup
        run: python -m unittest discover -s tests/platform -p test_file_locks.py -v
      - name: Verify Windows project capture adapter
        run: python -m unittest discover -s tests/platform -p test_agent_project_capture.py -v
      - name: Verify official offline environment preparation and reuse
        run: python -m unittest discover -s tests/platform -p test_agent_environments.py -v
